<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1030"/>
      <stop offset="1" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="16" y1="3" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4bbff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arc" x1="4" y1="16" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Subtle inner border glow -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25"
        stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>

  <!-- Lightning bolt — main shape -->
  <path d="M18.5 3.5 L7 17 H15 L13.5 28.5 L25 15 H17 Z"
        fill="url(#bolt)" filter="url(#glow)"/>

  <!-- Horizontal flow line below bolt -->
  <line x1="4" y1="27" x2="28" y2="27"
        stroke="url(#arc)" stroke-width="1" stroke-linecap="round"/>

  <!-- Three tiny dots on the flow line — represent content items -->
  <circle cx="8"  cy="27" r="1.2" fill="#a78bfa" opacity="0.9"/>
  <circle cx="16" cy="27" r="1.2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="24" cy="27" r="1.2" fill="#a78bfa" opacity="0.35"/>

  <!-- Sparkle top-right corner -->
  <path d="M25 6 L25.5 7.5 L27 8 L25.5 8.5 L25 10 L24.5 8.5 L23 8 L24.5 7.5 Z"
        fill="#d4bbff" opacity="0.7"/>
</svg>
